<!doctype html><html lang="de"><meta charset="utf-8"><title>Integrationstests</title><body><h1>Integrationstests</h1><pre id="results"></pre><iframe id="app" width="1000" height="600"></iframe><script>
const output=document.getElementById('results'),key='semester-survival-v1';
localStorage.setItem(key,JSON.stringify({group:'1',events:[{title:'TAMPERED CALENDAR',start:1,end:2}],config:{startDate:'1900-01-01'},mappings:[]}));
function assert(condition,message){if(!condition)throw Error(message);}
function pass(text){output.textContent+='PASS '+text+'\n';}
function fail(e){output.textContent+='FAIL '+e.message;document.body.dataset.result='FAIL';}
document.getElementById('app').onload=function(){try{
 const w=this.contentWindow,d=w.document,S=w.Survival;
 const raw=S.parseICS(w.SURVIVAL_BUNDLED_ICS,S.defaults).events;
 assert(raw.length===154,'Veröffentlichter Kalender fehlt');
 assert(!d.querySelector('[data-view="settings"],input[type=file],#config-form,#delete,#reimport'),'Kalenderänderung weiterhin in UI');
 assert(!JSON.parse(w.localStorage.getItem(key)).events,'Alter lokaler Kalender wurde behalten');pass('Kalender read-only; alte lokale Änderungen ignoriert');
 const filtered=g=>raw.filter(S.isTeachingEvent).filter(e=>{const m=e.title.match(/Gr\.?\s*([12])/i);return !m||m[1]===g;});
 const total=()=>Number(d.getElementById('semester-total').textContent.match(/(\d+) total events/)[1]);
 assert(total()===filtered('1').length,'Gruppe 1 falsch');d.querySelector('[name=study-group][value="2"]').click();assert(total()===filtered('2').length,'Gruppe 2 falsch');pass('Gruppenumschalter aktualisiert Termine');
 const fixed=new Date(2026,9,3,23,59,59).getTime();
 const c=S.coffeeStatistics(filtered('2'),S.defaults,w.SURVIVAL_COFFEE,fixed);
 assert(c.packs===1&&c.expenseCents===1200,'Cyber-Packung falsch');assert(c.savingCents===c.completedDays*380-1200,'Kaffeerechnung falsch');pass('Coffee: '+c.completedDays+' Uni-Tage, '+(c.savingCents/100).toFixed(2)+' EUR Vergleichsersparnis');
 const synthetic=[{start:new Date(2026,8,9,8).getTime(),end:new Date(2026,8,9,10).getTime()},{start:new Date(2026,8,10,8).getTime(),end:new Date(2026,8,10,10).getTime()},{start:new Date(2026,8,10,11).getTime(),end:new Date(2026,8,10,12).getTime()}];
 const cf={oldDailyPrice:3.8,packPrice:9,purchases:[{buyer:'cyber',packs:1,date:null},{buyer:'future',packs:1,date:'2027-01-01'}]};
 const early=S.coffeeStatistics(synthetic,S.defaults,cf,new Date(2026,8,10,11).getTime());assert(early.completedDays===0&&early.packs===1,'Unfertiger Tag/alter Tag/zukünftiger Kauf falsch');
 assert(S.coffeeStatistics(synthetic,S.defaults,cf,new Date(2026,8,10,12).getTime()).completedDays===1,'Tag nicht ab letzter Endzeit gezählt');pass('Coffee zählt Tage einmal, erst ab letztem Ende und innerhalb des Semesters');
 d.querySelector('[data-view="coffee"]').click();assert(d.getElementById('coffee-buyers').textContent.includes('cyber'),'Cyber fehlt auf Coffee-Seite');assert(!d.getElementById('coffee').querySelector('input,form'),'Öffentliche Kaffee-Eingabe vorhanden');pass('Coffee-Seite und Cyber-Käuferliste vorhanden; nur Dateiänderungen');
 assert(!S.isTeachingEvent({title:'Beurteilungsfindung_MAS3UE',description:''})&&!S.isTeachingEvent({title:'Beuteilungsfindung_DES3UE',description:''}),'Benotungstermine nicht herausgefiltert');assert(S.isTeachingEvent({title:'Prüfung_SWC3VO',description:''}),'Echte Prüfung fälschlich ausgefiltert');pass('Benotungsfindungen inklusive LEVIS-Tippfehler herausgefiltert');
 const coffeeNow=S.coffeeStatistics(filtered('2'),S.defaults,w.SURVIVAL_COFFEE,new Date(2026,9,10,23).getTime());assert(coffeeNow.packs===2&&coffeeNow.expenseCents===2400,'Phillip nicht eingerechnet');pass('Phillip: 07.10.2026, eine Packung; Gesamtkosten 24 EUR');
 d.getElementById('news-toggle').click();assert(d.getElementById('news-items').hidden,'News nicht einklappbar');d.getElementById('news-toggle').click();assert(!d.getElementById('news-items').hidden&&!d.getElementById('breaking-news').querySelector('input,textarea'),'News editierbar oder nicht aufklappbar');pass('Breaking News nur lesbar und aufklappbar');
 d.querySelector('[data-view="games"]').click();const mode=d.getElementById('ttt-mode');mode.value='local';mode.dispatchEvent(new w.Event('change'));const cells=d.getElementById('ttt-board').querySelectorAll('button');for(const i of [0,3,1,4,2])cells[i].click();assert(d.getElementById('ttt-status').textContent.includes('X gewinnt'),'Tic-Tac-Toe erkennt Sieg nicht');assert([...cells].every(cell=>cell.disabled),'Spiel endet nicht nach Sieg');d.getElementById('ttt-reset').click();assert([...cells].every(cell=>!cell.textContent&&!cell.disabled),'Neue Runde fehlerhaft');assert(S.ticTacToeMove(['X','X','','','O','','','',''])===2,'Computer blockiert Sieg nicht');pass('Tic-Tac-Toe: Sieg, Neustart und Computerblockade');
 assert(!d.getElementById('mental-health')&&!d.querySelector('[data-view="mental-health"]'),'Mental Health noch vorhanden');pass('Mental Health vollständig entfernt');
 d.querySelector('[data-view="calendar"]').click();
 const target=filtered('2').find(e=>{const dt=new Date(e.start);return dt.getFullYear()===new Date().getFullYear()&&dt.getMonth()===new Date().getMonth()&&e.description;});assert(target,'Kein Testtermin im aktuellen Monat');
 d.querySelector('[data-date="'+S.dateKey(new Date(target.start))+'"]').click();
 const details=d.querySelector('#selected-events details');assert(details,'Beschreibung fehlt');details.querySelector('summary').click();assert(details.open,'Beschreibung öffnet nicht');
 setTimeout(()=>{try{assert(d.querySelector('#selected-events details')===details&&details.open,'Beschreibung wurde beim Tick ersetzt/geschlossen');pass('Beschreibung bleibt über Timer-Tick offen');details.querySelector('summary').click();assert(!details.open,'Beschreibung schließt nicht');setTimeout(()=>{try{assert(d.querySelector('#selected-events details')===details&&!details.open,'Geschlossene Beschreibung wurde ersetzt/geöffnet');pass('Beschreibung bleibt nach Schließen geschlossen');document.body.dataset.result='PASS';}catch(e){fail(e);}},1300);}catch(e){fail(e);}},1300);
}catch(e){fail(e);}};
document.getElementById('app').src='index.html';
</script></body></html>
