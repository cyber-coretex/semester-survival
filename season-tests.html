<!doctype html><html lang="de"><meta charset="utf-8"><title>Saison-Tests</title><body><p id="era"></p><p id="sun-caption"></p><div id="season-decoration"></div><pre id="results"></pre><script src="js/subjects.js"></script><script src="js/designEvolution.js"></script><script>
let passed=0;const out=document.getElementById('results');function check(c,m){if(!c)throw Error(m);passed++;out.textContent+='PASS '+m+'\n';}
try{const date=(m,d)=>new Date(2026,m-1,d,12).getTime();check(Survival.seasonForDate(date(10,30))==='halloween','Halloween am 30.10.');check(Survival.seasonForDate(date(10,31))==='prechristmas','Vorweihnachten ab 31.10.');check(Survival.seasonForDate(date(11,30))==='prechristmas','Vorweihnachten bis 30.11.');check(Survival.seasonForDate(date(12,1))==='christmas','Weihnachten ab 01.12.');check(Survival.seasonForDate(new Date(2027,0,1).getTime())==='normal','Normaler Look ab Januar');const config=Survival.defaults;Survival.applyDesign(config,'auto',new Date(config.startDate+'T00:00:00').getTime());const dark=+document.documentElement.style.getPropertyValue('--forest-night');const earlySun=parseFloat(document.documentElement.style.getPropertyValue('--sun-rise'));Survival.applyDesign(config,'auto',new Date(config.endDate+'T23:59:59').getTime());check(+document.documentElement.style.getPropertyValue('--forest-night')<dark,'Wald wird zum Semesterende heller');check(parseFloat(document.documentElement.style.getPropertyValue('--sun-rise'))>earlySun,'Sonne steigt im Semester auf');check(document.documentElement.style.getPropertyValue('--forest-flowers')==='1','Blumen erst gegen Semesterende voll sichtbar');Survival.applyDesign(config,'auto',date(10,10));check(document.body.dataset.season==='halloween','Halloween-Deko aktuell aktiv');document.body.dataset.result='PASS';out.textContent+=passed+' Tests bestanden';}catch(e){document.body.dataset.result='FAIL';out.textContent+='FAIL '+e.message;}
</script></body></html>
